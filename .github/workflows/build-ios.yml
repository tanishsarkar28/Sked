name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sked-app/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Setup iOS Project Scaffolding
        run: |
          cd sked-app
          if [ ! -d "ios" ]; then
            echo "Generating iOS platform project files with project-name sked_app..."
            flutter create --project-name sked_app --platforms=ios --org com.sked .
          fi
          # Ensure display name is Sked using macOS PlistBuddy
          if [ -f "ios/Runner/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Sked" ios/Runner/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Sked" ios/Runner/Info.plist 2>/dev/null || true
          fi

      - name: Install Flutter Dependencies
        run: |
          cd sked-app
          flutter pub get

      - name: Build iOS Archive (Unsigned)
        run: |
          cd sked-app
          flutter build ipa --no-codesign

      - name: Package Unsigned .IPA
        run: |
          cd sked-app
          echo "Locating Runner.app..."
          mkdir -p Payload
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            cp -R "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" Payload/
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -R "build/ios/iphoneos/Runner.app" Payload/
          else
            RUNNER_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
            if [ -n "$RUNNER_PATH" ]; then
              cp -R "$RUNNER_PATH" Payload/
            else
              echo "Error: Runner.app not found!"
              exit 1
            fi
          fi
          zip -r -y sked-ios.ipa Payload
          ls -lh sked-ios.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sked-ios.ipa
          path: sked-app/sked-ios.ipa
          retention-days: 30

      - name: Commit Updated IPA to Repository
        run: |
          mkdir -p sked-web/public/downloads
          cp sked-app/sked-ios.ipa sked-web/public/downloads/sked-ios.ipa
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sked-web/public/downloads/sked-ios.ipa
          if [ -d "sked-app/ios" ]; then
            git add sked-app/ios
          fi
          git commit -m "chore: update native sked-ios.ipa binary [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped or permissions restricted in repo settings"
